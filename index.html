<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업무 현황">
<meta name="color-scheme" content="light dark">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>인사팀 업무 현황</title>
<style>
/* 레이아웃: 위에서 아래로 한 줄 목록. 급한 일부터 보이게 하고, 팀원별·전체는 탭으로 나눈다. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --fg:#151B26; --sub:#566074; --line:#E1E6EE;
  --accent:#2F5BEA; --accent-weak:#E8EEFE;
  --late:#D23B3B; --late-weak:#FDECEC; --warn:#B26A00; --warn-weak:#FFF1DA; --ok:#1E8E5A; --ok-weak:#E3F5EC;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10141C; --surface:#1A202B; --fg:#ECEFF5; --sub:#9AA5B8; --line:#2A3241;
  --accent:#7B9CFF; --accent-weak:#222E52;
  --late:#FF7A7A; --late-weak:#3A2024; --warn:#F2B25C; --warn-weak:#3A2D16; --ok:#5ED19A; --ok-weak:#15332A; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#1A202B; --fg:#ECEFF5; --sub:#9AA5B8; --line:#2A3241;
  --accent:#7B9CFF; --accent-weak:#222E52;
  --late:#FF7A7A; --late-weak:#3A2024; --warn:#F2B25C; --warn-weak:#3A2D16; --ok:#5ED19A; --ok-weak:#15332A; color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 32px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px}
h1{font-size:20px;line-height:1.3;margin:0}
.stamp{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:2px;font-size:12.5px;color:var(--sub)}
.stamp .stale{color:var(--warn);font-weight:700}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:13px}
.sum{display:flex;gap:6px;margin-top:10px}
.sum div{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sum b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--sub)}
.sum .hot b{color:var(--late)} .sum .amb b{color:var(--warn)}
.tabs{display:flex;gap:4px;background:var(--line);border-radius:10px;padding:3px;margin-top:12px}
.tabs button{flex:1;border:0;background:none;border-radius:8px;padding:9px 4px;font-size:14px;font-weight:600;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(20,30,50,.12)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:18px;padding-block:14px}
.sec h2{font-size:13px;margin:0 0 6px;color:var(--sub);font-weight:700}
.sec h2 em{font-style:normal;color:var(--fg);font-variant-numeric:tabular-nums}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.row .body{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:12.5px;color:var(--sub);margin-top:2px;overflow-wrap:anywhere}
.row .n{font-size:13px;margin-top:5px;overflow-wrap:anywhere}
.row .n i{font-style:normal;color:var(--accent);font-weight:700;margin-right:4px}
.row.tap{cursor:pointer}
.row .brief{font-size:13px;margin-top:5px;color:var(--fg);overflow-wrap:anywhere}
.row .brief i{font-style:normal;color:var(--sub);font-weight:700;margin-right:4px}
.row .det{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px;overflow-wrap:anywhere}
.row.open .det{display:block}
.det h3{font-size:12px;color:var(--sub);margin:10px 0 2px;font-weight:700}
.det h3:first-child{margin-top:0}
.det p{margin:0;white-space:pre-wrap}
.det ul{margin:0;padding-left:18px}
.det li.dn{color:var(--sub);text-decoration:line-through}
.det .u{color:var(--sub);font-variant-numeric:tabular-nums;margin-right:6px}
.due{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--accent-weak);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.due.late{background:var(--late-weak);color:var(--late)} .due.soon{background:var(--warn-weak);color:var(--warn)} .due.done{background:var(--ok-weak);color:var(--ok)} .due.none{background:var(--line);color:var(--sub)}
.who{font-weight:700;color:var(--fg)}
.empty{padding:16px 14px;color:var(--sub);font-size:14px}
details.mem{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.mem + details.mem{margin-top:8px}
details.mem summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
details.mem summary::-webkit-details-marker{display:none}
details.mem summary .nm{flex:1;min-width:0}
details.mem summary .nm b{font-size:15.5px}
details.mem summary .nm span{display:block;font-size:12.5px;color:var(--sub)}
details.mem summary .cnt{font-size:13px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
details.mem summary .cnt em{font-style:normal;color:var(--late);font-weight:700}
details.mem[open] summary{border-bottom:1px solid var(--line)}
details.mem .row:first-child{border-top:0}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--sub)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 16px;margin-top:18px}
.hero h2{margin:0 0 6px;font-size:18px}
.hero p{margin:0 0 12px;color:var(--sub);font-size:14px}
.hero ol{margin:0 0 16px;padding-left:20px;color:var(--sub);font-size:14px}
.hero ol b{color:var(--fg)}
.btn{display:inline-block;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;padding:12px 18px;font-size:15px}
.btn.alt{background:none;color:var(--accent);padding-inline:8px}
.err{margin-top:10px;color:var(--late);font-size:13.5px}
.note{margin:0;font-size:12px;color:var(--sub)}
.sample{display:inline-block;background:var(--warn-weak);color:var(--warn);font-weight:700;font-size:12px;border-radius:999px;padding:1px 9px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>인사팀 업무 현황</h1>
    <div class="stamp" id="stamp" hidden></div>
    <div id="top" hidden>
      <div class="sum" id="sum"></div>
      <div class="tabs" role="tablist" aria-label="보기">
        <button role="tab" id="tb-urgent" aria-selected="true" data-tab="urgent">급한 일</button>
        <button role="tab" id="tb-team" aria-selected="false" data-tab="team">팀원별</button>
        <button role="tab" id="tb-all" aria-selected="false" data-tab="all">전체</button>
        <button role="tab" id="tb-rec" aria-selected="false" data-tab="rec">기록용</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <input type="file" id="file" accept="application/json,.json,text/plain">
</div>

<script>
(function(){
  var KEY = 'slb_m_data_v1';
  var STAGE_ORDER = ['intake','writing','review','approval','done'];
  var STAGE_NAME = {intake:'접수', writing:'작성 중', review:'검토 중', approval:'승인 대기', done:'완료'};
  var D = null, sample = false, tab = 'urgent', q = '', stageF = '';
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function today(){ var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function dleft(ds){ var p = String(ds).split('-'); if(p.length < 3) return null; return Math.round((new Date(+p[0], +p[1] - 1, +p[2]) - today()) / 86400000); }
  function store(get, v){ try { if(get) return localStorage.getItem(KEY); if(v == null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, v); } catch(e){} return null; }

  function sampleData(){
    var t = today(), f = function(n){ var d = new Date(t); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
    var now = new Date(); var at = f(0) + ' ' + ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2) + ':00';
    return {app:'모바일 현황', at:at,
      members:[{name:'팀원 가',title:'책임',memo:'교육, 조직문화'},{name:'팀원 나',title:'책임',memo:'평가'},{name:'팀원 다',title:'선임',memo:'급여, 평가'},{name:'팀원 라',title:'선임',memo:'급여, 교육'},{name:'팀원 마',title:'주임',memo:'채용'}],
      cards:[
        {id:'s1',no:'HR-0412',title:'리더십 과정 운영 안내문',cat:'교육·육성',stage:'approval',owner:'팀원 가',collab:['팀원 라'],due:f(-2),next:'교육 일정 확정 후 안내문 발송',req:'리더 대상 교육 과정의 운영 일정과 참석 안내문을 만들어 주세요.',prog:'안내문 초안 작성 완료. 일정 확정을 기다리는 중.',todo:[{t:'일정 확정',d:false},{t:'안내문 발송',d:false}],ups:[{at:f(-5),t:'안내문 초안 작성'},{at:f(-3),t:'팀장 검토 요청'}]},
        {id:'s2',no:'HR-0415',title:'하반기 평가 일정 공지',cat:'평가·보상',stage:'writing',owner:'팀원 나',due:f(2),next:'평가 기간과 제출처 확인',req:'하반기 평가 일정을 전 직원에게 공지해야 합니다.',prog:'공지 문구 초안 작성 중.',ups:[{at:f(-1),t:'일정표 수령'}]},
        {id:'s3',no:'HR-0418',title:'급여 기준 점검 회신',cat:'급여',stage:'review',owner:'팀원 다',collab:['팀원 라','팀원 나'],due:f(9),next:'수당 기준 조항 대조',hidden:1},
        {id:'s4',no:'HR-0420',title:'신입 교육 계획',cat:'교육·육성',stage:'intake',owner:'팀원 라',due:f(15),next:'대상자와 교육 기간 확인',req:'신입 사원 교육 계획안 작성.',prog:'접수 완료. 대상자 확인 전.'},
        {id:'s5',no:'HR-0421',title:'생산직 채용공고 초안',cat:'채용',stage:'writing',owner:'팀원 마',due:f(4),next:'모집 요강과 근무 조건 정리',req:'생산직 채용공고 초안.',prog:'모집 요강 정리 중.'},
        {id:'s6',no:'HR-0409',title:'법정교육 이수 현황 취합',cat:'교육·육성',stage:'done',owner:'팀원 라',due:f(-6),doneAt:f(-5),next:'',req:'법정교육 이수 현황 취합.',done:{sum:'부서별 이수 현황을 취합해 보고함.',to:'팀장',notes:''}}
      ],
      records:[
        {id:'r1',no:'REC-1',title:'사내 교육 문의 답변',cat:'교육·육성',date:f(-3),requester:'생산팀',handler:'팀원 가',outcome:'교육 신청 방법을 안내함.',notes:'다음 분기 일정은 추후 공지 예정.',kw:'교육, 신청'},
        {id:'r2',no:'REC-2',title:'급여 관련 문의',cat:'급여',date:f(-8),requester:'',handler:'팀원 나',hidden:1}
      ]};
  }
  function valid(o){ return o && typeof o === 'object' && Array.isArray(o.cards) && Array.isArray(o.members); }
  function load(o, isSample){ D = o; sample = !!isSample; if(!isSample) store(false, JSON.stringify(o)); render(); }
  function readFile(f){
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){ var o; try { o = JSON.parse(r.result); } catch(e){ return fail('파일을 읽을 수 없습니다. 노트북 프로그램이 만든 모바일_현황.json 파일인지 확인하세요.'); }
      if(!valid(o)) return fail('모바일_현황.json 형식이 아닙니다. 아이클라우드 업무 폴더 맨 위에 있는 파일을 선택하세요.');
      load(o, false); };
    r.onerror = function(){ fail('파일을 열지 못했습니다. 다시 선택해 주세요.'); };
    r.readAsText(f);
  }
  function fail(msg){ var e = $('err'); if(!e){ D = null; render(); e = $('err'); } if(e) e.textContent = msg; }
  function pick(){ $('file').value = ''; $('file').click(); }

  function dueChip(c){
    if(c.stage === 'done') return '<span class="due done">완료' + (c.doneAt ? ' ' + esc(c.doneAt.slice(5).replace('-', '/')) : '') + '</span>';
    if(!c.due) return '<span class="due none">마감 없음</span>';
    var n = dleft(c.due); if(n == null) return '<span class="due none">' + esc(c.due) + '</span>';
    if(n < 0) return '<span class="due late">' + (-n) + '일 지남</span>';
    if(n === 0) return '<span class="due soon">오늘</span>';
    if(n <= 3) return '<span class="due soon">D-' + n + '</span>';
    return '<span class="due">' + esc(c.due.slice(5).replace('-', '/')) + '</span>';
  }
  function colab(c){ return (c.collab || []).filter(function(n){ return n && n !== c.owner; }); }
  function clip(t, n){ t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t; }
  function lastProg(c){ var u = c.ups && c.ups.length ? c.ups[c.ups.length - 1] : null; return c.prog || (u ? u.t : '') || ''; }
  function hasDet(c){ return !!(c.req || c.prog || (c.ups && c.ups.length) || (c.todo && c.todo.length) || c.done || c.nextAll); }
  function part(t, v){ return v ? '<h3>' + t + '</h3><p>' + esc(v) + '</p>' : ''; }
  function detail(c){
    var h = '';
    if(c.handler !== undefined && c.date !== undefined){
      h += part('요청자', c.requester) + part('처리한 사람', c.handler) + part('처리 결과', c.outcome) + part('메모', c.notes) + part('키워드', c.kw);
      return h || '<p>내용이 없습니다.</p>';
    }
    h += part('요청자', c.requester) + part('요청 내용', c.req) + part('진행 상황', c.prog);
    if(c.todo && c.todo.length) h += '<h3>할 일</h3><ul>' + c.todo.map(function(x){ return '<li' + (x.d ? ' class="dn"' : '') + '>' + esc(x.t) + '</li>'; }).join('') + '</ul>';
    h += part('다음 할 일', c.nextAll);
    if(c.ups && c.ups.length) h += '<h3>진행 기록</h3><ul>' + c.ups.slice().reverse().map(function(u){ return '<li><span class="u">' + esc((u.at || '').slice(5).replace('-', '/')) + '</span>' + esc(u.t) + '</li>'; }).join('') + '</ul>';
    if(c.done) h += part('완료 내용', c.done.sum) + part('전달 대상', c.done.to) + part('비고', c.done.notes);
    return h || '<p>내용이 없습니다.</p>';
  }
  function row(c, forMember){
    var who = forMember == null ? '<span class="who">' + esc(c.owner || '담당 미지정') + '</span>' + (colab(c).length ? ' + ' + esc(colab(c).join(', ')) : '') + ' · '
      : (c.owner === forMember ? '' : '<span class="who">함께</span> · 담당 ' + esc(c.owner || '미지정') + ' · ');
    var brief = (c.req ? '<div class="brief"><i>내용</i>' + esc(clip(c.req, 70)) + '</div>' : '') + (lastProg(c) && c.stage !== 'done' ? '<div class="brief"><i>진행</i>' + esc(clip(lastProg(c), 80)) + '</div>' : '') + (c.done && c.done.sum ? '<div class="brief"><i>결과</i>' + esc(clip(c.done.sum, 80)) + '</div>' : '');
    var tap = hasDet(c) || c.hidden;
    return '<div class="row' + (tap ? ' tap' : '') + '" data-id="' + esc(c.id) + '"><div class="body"><div class="t">' + esc(c.title) + '</div><div class="m">' + who + esc(c.cat) + ' · ' + esc(STAGE_NAME[c.stage] || c.stage) + (c.no ? ' · ' + esc(c.no) : '') + '</div>' + brief + (c.next && c.stage !== 'done' ? '<div class="n"><i>다음</i>' + esc(c.next) + '</div>' : '') +
      (tap ? '<div class="det">' + (c.hidden ? '<p>급여·평가 업무라서 제목만 보입니다. 노트북 프로그램 설정에서 바꿀 수 있습니다.</p>' : detail(c)) + '</div>' : '') + '</div>' + dueChip(c) + '</div>';
  }
  function recRow(r){
    return '<div class="row tap" data-id="' + esc(r.id) + '"><div class="body"><div class="t">' + esc(r.title) + '</div><div class="m">' + esc((r.date || '').slice(5).replace('-', '/')) + ' · ' + esc(r.cat) + (r.requester ? ' · 요청 ' + esc(r.requester) : '') + (r.handler ? ' → ' + esc(r.handler) : '') + '</div>' +
      (r.outcome ? '<div class="brief"><i>결과</i>' + esc(clip(r.outcome, 80)) + '</div>' : '') +
      '<div class="det">' + (r.hidden ? '<p>급여·평가 기록이라서 제목만 보입니다.</p>' : detail(r)) + '</div></div></div>';
  }
  function byDue(a, b){ var x = a.due || '9999', y = b.due || '9999'; return x < y ? -1 : x > y ? 1 : 0; }
  function sec(title, arr){ return '<section class="sec"><h2>' + esc(title) + ' <em>' + arr.length + '</em></h2><div class="list">' + (arr.length ? arr.map(function(c){ return row(c); }).join('') : '<div class="empty">해당 업무가 없습니다.</div>') + '</div></section>'; }

  function stampHTML(){
    var at = String(D.at || ''), txt = at ? (+at.slice(5, 7)) + '월 ' + (+at.slice(8, 10)) + '일 ' + at.slice(11, 16) : '';
    var stale = '';
    if(at && !sample){ var p = at.slice(0, 10).split('-'); var n = Math.round((today() - new Date(+p[0], +p[1] - 1, +p[2])) / 86400000); if(n >= 1) stale = '<span class="stale">' + n + '일 전 현황입니다</span>'; }
    return (sample ? '<span class="sample">예시 데이터</span>' : '') + '<span>노트북에서 저장한 시각 ' + esc(txt) + '</span>' + stale + '<button class="link" id="reload">새 파일 불러오기</button>';
  }
  function render(){
    var main = $('main'), top = $('top'), stamp = $('stamp');
    if(!D){
      top.hidden = true; stamp.hidden = true;
      main.innerHTML = '<section class="hero"><h2>업무 현황 파일을 불러오세요</h2><p>이 화면은 조회 전용입니다. 노트북 프로그램이 저장한 파일을 이 기기 안에서만 읽어서 보여 주며, 어디로도 전송하지 않습니다.</p>' +
        '<ol><li>파일 앱에서 <b>iCloud Drive</b>의 업무 폴더를 엽니다.</li><li>맨 위의 <b>모바일_현황.json</b>을 선택합니다.</li></ol>' +
        '<button class="btn" id="pick">파일 선택</button> <button class="btn alt" id="demo">예시로 둘러보기</button><div class="err" id="err" role="alert"></div></section>' +
        '<p class="note">불러온 내용은 이 기기의 브라우저에만 저장됩니다. 노트북에서 업무를 고친 뒤에는 파일을 다시 불러오세요.</p>';
      $('pick').onclick = pick; $('demo').onclick = function(){ load(sampleData(), true); };
      return;
    }
    var cards = D.cards.slice(), open = cards.filter(function(c){ return c.stage !== 'done'; });
    var late = open.filter(function(c){ return c.due && dleft(c.due) < 0; }), soon = open.filter(function(c){ var n = c.due ? dleft(c.due) : null; return n != null && n >= 0 && n <= 3; });
    stamp.hidden = false; stamp.innerHTML = stampHTML(); top.hidden = false;
    $('sum').innerHTML = '<div class="' + (late.length ? 'hot' : '') + '"><b>' + late.length + '</b><span>마감 지남</span></div><div class="' + (soon.length ? 'amb' : '') + '"><b>' + soon.length + '</b><span>3일 내 마감</span></div><div><b>' + open.length + '</b><span>진행 중</span></div>';
    ['urgent','team','all','rec'].forEach(function(t){ $('tb-' + t).setAttribute('aria-selected', String(tab === t)); });
    var html = '';
    if(tab === 'urgent'){
      var appr = open.filter(function(c){ return c.stage === 'approval' && late.indexOf(c) < 0 && soon.indexOf(c) < 0; });
      html = sec('마감 지남', late.sort(byDue)) + sec('3일 안에 마감', soon.sort(byDue)) + sec('승인 대기', appr.sort(byDue));
    } else if(tab === 'team'){
      var names = D.members.map(function(m){ return m.name; });
      open.forEach(function(c){ var o = c.owner || '담당 미지정'; if(names.indexOf(o) < 0) names.push(o); });
      html = names.map(function(n){
        var m = D.members.filter(function(x){ return x.name === n; })[0] || {name:n,title:'',memo:''};
        var own = open.filter(function(c){ return (c.owner || '담당 미지정') === n; }).sort(byDue);
        var wth = open.filter(function(c){ return c.owner !== n && colab(c).indexOf(n) >= 0; }).sort(byDue);
        var mine = own.concat(wth);
        var lt = own.filter(function(c){ return c.due && dleft(c.due) < 0; }).length;
        return '<details class="mem"' + (mine.length ? ' open' : '') + '><summary><div class="nm"><b>' + esc(n) + '</b> ' + esc(m.title) + '<span>' + esc(m.memo) + '</span></div><div class="cnt">진행 ' + own.length + (wth.length ? ' · 함께 ' + wth.length : '') + (lt ? ' · <em>지연 ' + lt + '</em>' : '') + '</div></summary>' +
          (mine.length ? mine.map(function(c){ return row(c, n); }).join('') : '<div class="empty">진행 중인 업무가 없습니다.</div>') + '</details>';
      }).join('');
    } else if(tab === 'rec'){
      var recs = (D.records || []).filter(function(r){ return !q || (r.title + ' ' + (r.requester || '') + ' ' + (r.handler || '') + ' ' + (r.outcome || '') + ' ' + (r.notes || '') + ' ' + (r.kw || '') + ' ' + r.cat).toLowerCase().indexOf(q.toLowerCase()) >= 0; });
      html = '<input class="search" id="q" type="search" placeholder="기록 검색" value="' + esc(q) + '" aria-label="검색">' +
        '<section class="sec"><div class="list">' + (recs.length ? recs.map(recRow).join('') : '<div class="empty">' + ((D.records || []).length ? '조건에 맞는 기록이 없습니다.' : '기록용 업무가 없거나, 노트북 프로그램을 새 버전으로 열어 저장하면 나타납니다.') + '</div>') + '</div></section>' +
        '<p class="note">기록용으로 넣은 업무 최근 150건까지 들어 있습니다. 항목을 누르면 내용이 펼쳐집니다.</p>';
    } else {
      var list = cards.filter(function(c){ return (!stageF || c.stage === stageF) && (!q || (c.title + ' ' + (c.owner || '') + ' ' + colab(c).join(' ') + ' ' + c.cat + ' ' + (c.no || '') + ' ' + (c.next || '') + ' ' + (c.req || '') + ' ' + (c.prog || '')).toLowerCase().indexOf(q.toLowerCase()) >= 0); });
      list.sort(function(a, b){ return (a.stage === 'done') - (b.stage === 'done') || byDue(a, b); });
      html = '<input class="search" id="q" type="search" placeholder="업무, 담당자, 번호 검색" value="' + esc(q) + '" aria-label="검색">' +
        '<div class="chips" id="chips">' + [''].concat(STAGE_ORDER).map(function(s){ return '<button data-st="' + s + '" aria-pressed="' + String(stageF === s) + '">' + (s ? STAGE_NAME[s] : '전체') + '</button>'; }).join('') + '</div>' +
        '<section class="sec"><div class="list" id="alllist">' + (list.length ? list.map(function(c){ return row(c); }).join('') : '<div class="empty">조건에 맞는 업무가 없습니다.</div>') + '</div></section>' +
        '<p class="note">완료한 업무는 최근 30일 분만 들어 있습니다.</p>';
    }
    main.innerHTML = html;
    var rl = $('reload'); if(rl) rl.onclick = pick;
    var qi = $('q'); if(qi) qi.oninput = function(){ q = qi.value; var pos = qi.selectionStart; render(); var n = $('q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} };
    var ch = $('chips'); if(ch) ch.onclick = function(e){ var b = e.target.closest('button'); if(!b) return; stageF = b.getAttribute('data-st'); render(); };
  }
  document.querySelector('.tabs').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; tab = b.getAttribute('data-tab'); render(); });
  $('main').addEventListener('click', function(e){ var r = e.target.closest('.row.tap'); if(!r) return; r.classList.toggle('open'); });
  $('file').addEventListener('change', function(e){ readFile(e.target.files && e.target.files[0]); });

  var saved = store(true); if(saved){ try { var o = JSON.parse(saved); if(valid(o)) D = o; } catch(e){} }
  render();
})();
</script>

</body>
</html>
